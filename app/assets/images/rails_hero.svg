<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Stylized Ruby on Rails illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="gemHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
  </defs>

  <rect width="480" height="360" rx="24" fill="url(#bg)"/>

  <g opacity="0.35" stroke="#9f1239" stroke-width="2" fill="none">
    <path d="M40 280 L440 280"/>
    <path d="M40 300 L440 300"/>
    <g>
      <rect x="60"  y="282" width="20" height="16" fill="#9f1239" opacity="0.4"/>
      <rect x="120" y="282" width="20" height="16" fill="#9f1239" opacity="0.4"/>
      <rect x="180" y="282" width="20" height="16" fill="#9f1239" opacity="0.4"/>
      <rect x="240" y="282" width="20" height="16" fill="#9f1239" opacity="0.4"/>
      <rect x="300" y="282" width="20" height="16" fill="#9f1239" opacity="0.4"/>
      <rect x="360" y="282" width="20" height="16" fill="#9f1239" opacity="0.4"/>
    </g>
  </g>

  <g transform="translate(240 150)">
    <polygon points="-110,-20 110,-20 75,80 -75,80" fill="url(#gem)" stroke="#7f1d1d" stroke-width="3"/>
    <polygon points="-110,-20 -75,80 -45,-20" fill="url(#gemHi)" opacity="0.7"/>
    <polygon points="110,-20 75,80 45,-20" fill="url(#gemHi)" opacity="0.5"/>
    <polygon points="-45,-20 0,80 45,-20" fill="#fecdd3" opacity="0.4"/>
    <polygon points="-110,-20 -75,-50 75,-50 110,-20 75,-20 45,-50 -45,-50 -75,-20" fill="#be123c" stroke="#7f1d1d" stroke-width="3"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="240" y="60" font-size="22" font-weight="700" fill="#9f1239">Ruby on Rails</text>
    <text x="240" y="84" font-size="13" fill="#9f1239" opacity="0.75">Convention over Configuration</text>
  </g>
</svg>
