<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-label="Envelope and chat bubble illustration">
  <defs>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <rect width="360" height="280" rx="20" fill="#fff1f2"/>

  <g transform="translate(40 80)">
    <rect x="0" y="0" width="220" height="140" rx="10" fill="url(#env)" stroke="#7f1d1d" stroke-width="3"/>
    <polygon points="0,0 110,80 220,0" fill="#fecdd3" stroke="#7f1d1d" stroke-width="3"/>
    <polygon points="0,140 80,70 220,140" fill="#fda4af" opacity="0.6"/>
  </g>

  <g transform="translate(200 30)">
    <path d="M0,30 Q0,0 30,0 H110 Q140,0 140,30 V70 Q140,100 110,100 H50 L20,125 V100 Q0,100 0,80 Z"
          fill="white" stroke="#9f1239" stroke-width="3"/>
    <circle cx="40" cy="50" r="5" fill="#9f1239"/>
    <circle cx="70" cy="50" r="5" fill="#9f1239"/>
    <circle cx="100" cy="50" r="5" fill="#9f1239"/>
  </g>
</svg>
