# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Production uses PostgreSQL via DATABASE_URL (see docker-compose.prod.yml).
# The pg gem is loaded only in the :production bundler group, so dev/test
# stay on SQLite without needing libpq locally.
production:
  adapter: postgresql
  # ENV["..."] (vs ENV.fetch) returns nil instead of raising when unset, so
  # `rails assets:precompile` at Docker build time doesn't blow up trying
  # to parse this file just because DATABASE_URL isn't injected yet. The
  # adapter only connects when it's actually used at runtime, and at that
  # point docker-compose has DATABASE_URL set from the env file.
  url: <%= ENV["DATABASE_URL"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  encoding: unicode
